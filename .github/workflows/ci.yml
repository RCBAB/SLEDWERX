name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Starts a throwaway local Supabase stack (Postgres, Auth, REST API) in
      # Docker on the runner and applies supabase/migrations to it.
      # Never connects to the live project.
      # Storage is kept running: Migration 3 creates a bucket and storage policies.
      - run: >-
          npx supabase start
          -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase test db
      - name: API smoke test (local stack)
        run: |
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" \
            node scripts/db-api-smoke-test.mjs
      # Exercises supabase/rollback/ against the throwaway local database only.
      # Rollback scripts are never applied to any real database by CI.
      # Order: newest first. After each rollback, the tests of the remaining
      # migrations run again on the result; finally Migration 1's rollback.
      # Migration 8: the cleanup job against the local stack (real users,
      # uploads, storage policies and Storage API removals).
      - name: Cleanup job integration test (local stack)
        run: |
          eval "$(npx supabase status -o env)"
          export CLEANUP_IT_URL="$API_URL"
          export CLEANUP_IT_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          export CLEANUP_IT_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          npx vitest run src/lib/cleanup/cleanup.integration.test.ts
        env:
          THROWAWAY_DATABASE: "yes"
          CLEANUP_IT_PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      # Migration 8: the cleanup's locking, checked with two real sessions.
      - name: Cleanup concurrency test (local stack)
        run: scripts/test-cleanup-concurrency.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 8 rollback test (local stack)
        run: scripts/test-migration-8-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1-7 tests after Migration 8 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
          supabase/tests/database/004_sled_photos_and_create_sled.test.sql
          supabase/tests/database/005_service_records.test.sql
          supabase/tests/database/006_maintenance_board.test.sql
          supabase/tests/database/007_garage_board.test.sql
          supabase/tests/database/008_meter_updates.test.sql
          supabase/tests/database/009_issues.test.sql
          supabase/tests/database/010_suspension.test.sql
      - name: Migration 7 rollback test (local stack)
        run: scripts/test-migration-7-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1-6 tests after Migration 7 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
          supabase/tests/database/004_sled_photos_and_create_sled.test.sql
          supabase/tests/database/005_service_records.test.sql
          supabase/tests/database/006_maintenance_board.test.sql
          supabase/tests/database/007_garage_board.test.sql
          supabase/tests/database/008_meter_updates.test.sql
          supabase/tests/database/009_issues.test.sql
      - name: Migration 6 rollback test (local stack)
        run: scripts/test-migration-6-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1-5 tests after Migration 6 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
          supabase/tests/database/004_sled_photos_and_create_sled.test.sql
          supabase/tests/database/005_service_records.test.sql
          supabase/tests/database/006_maintenance_board.test.sql
          supabase/tests/database/007_garage_board.test.sql
          supabase/tests/database/008_meter_updates.test.sql
      - name: Migration 5 rollback test (local stack)
        run: scripts/test-migration-5-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1-4 tests after Migration 5 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
          supabase/tests/database/004_sled_photos_and_create_sled.test.sql
          supabase/tests/database/005_service_records.test.sql
      - name: Migration 4 rollback test (local stack)
        run: scripts/test-migration-4-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1-3 tests after Migration 4 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
          supabase/tests/database/004_sled_photos_and_create_sled.test.sql
      - name: Migration 3 rollback test (local stack)
        run: scripts/test-migration-3-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1 and 2 tests after Migration 3 rollback (local stack)
        run: >-
          npx supabase test db
          supabase/tests/database/001_foundation.test.sql
          supabase/tests/database/002_maintenance_logbook.test.sql
          supabase/tests/database/003_save_maintenance_entry.test.sql
      - name: Migration 2 rollback test (local stack)
        run: scripts/test-migration-2-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - name: Migration 1 tests after Migration 2 rollback (local stack)
        run: npx supabase test db supabase/tests/database/001_foundation.test.sql
      - name: Migration 1 rollback test (local stack)
        run: scripts/test-migration-1-rollback.sh
        env:
          THROWAWAY_DATABASE: "yes"
          PSQL: docker exec -i supabase_db_sledwerx psql -U postgres
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Throwaway local Supabase stack with Auth, Storage (sled photos) and the
      # Mailpit inbox (password-reset email). Never connects to the live project.
      - run: >-
          npx supabase start
          -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Generated database types are up to date
        run: |
          eval "$(npx supabase status -o env)"
          npx supabase gen types typescript --remote="$DB_URL" --schema public > "$RUNNER_TEMP/database.types.ts"
          normalize() { grep -v '^Connecting to' "$1" | sed '/./,$!d'; }
          diff -u <(normalize src/lib/supabase/database.types.ts) <(normalize "$RUNNER_TEMP/database.types.ts") \
            || { echo "::error::src/lib/supabase/database.types.ts is out of date. Run npm run db:types."; exit 1; }
      - run: npx playwright install --with-deps chromium
      - name: Build against the local stack
        run: |
          eval "$(npx supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" npm run build
      - name: Playwright
        run: |
          eval "$(npx supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export E2E_SUPABASE=1 MAILPIT_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          # Administrator setup for the cleanup dashboard tests (throwaway stack only).
          export E2E_PSQL="docker exec -i supabase_db_sledwerx psql -U postgres"
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
